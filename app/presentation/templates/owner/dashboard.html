{% extends "base.html" %}
{% block title %}점주 대시보드{% endblock %}
{% block content %}
<h1 class="h4 mb-4">오늘의 매장 현황</h1>
<div class="row g-3">
  <div class="col-md-4"><div class="card"><div class="card-body">
    <h2 class="h6">오늘 예약</h2><p class="display-6">{{ reservations|length }}</p>
  </div></div></div>
  <div class="col-md-4"><div class="card"><div class="card-body">
    <h2 class="h6">미응답 문의</h2><p class="display-6">{{ unanswered }}</p>
  </div></div></div>
  <div class="col-md-4"><div class="card"><div class="card-body">
    <h2 class="h6">최근 생성 콘텐츠</h2><p class="display-6">{{ contents|length }}</p>
  </div></div></div>
</div>
{% endblock %}
