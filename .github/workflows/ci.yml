# PR마다 팀 규칙(CLAUDE.md)의 "ruff 통과 + pytest 전체 통과"를 자동으로 검사한다.
# 브랜치 보호 규칙이 이 job 이름(test)을 필수 검사로 지정하므로 이름을 바꾸면 보호 설정도 같이 바꿔야 한다.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: ruff 린트
        run: ruff check .

      - name: ruff 포맷 검사
        run: ruff format --check .

      # 테스트는 MockAIClient만 쓰므로 API 키 없이 돌아간다.
      - name: pytest
        run: pytest -q
